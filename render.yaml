services:
  - type: web
    name: pawnee-app
    runtime: node
    buildCommand: npm install --include=dev --prefix backend && npm run build --prefix backend && npm install --include=dev --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_DB
        value: pawnee_mongoose
      - key: MONGODB_URI
        sync: false
